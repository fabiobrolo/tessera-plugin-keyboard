# Tessera Plugin Manifest for Keyboard
id: keyboard
version: 0.1.1
api: "0.8"
icon: monitor
maintainer: fabiobrolo
license: MIT
stage: beta
topics: [home, tech]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

# Grants permission to call the user-configured Home Assistant script
permissions:
  home_assistant_actions: ["{target_script}"]

# Screen-scoped configuration input requiring a Home Assistant script entity
inputs:
  - id: target_script
    kind: entity
    domains: [script]
    scope: screen
    label: target_script
    hint: target_script_hint

# Dashboard tile definition (supports 1x1 up to 2x2 grid spans)
tiles:
  - id: keyboard
    name: tile_name
    icon: monitor
    sizes: { min: 1x1, max: 2x2 }
    memory: 600
    example: tile_example

# Full-width modal card hosting the on-screen virtual keyboard
cards:
  - id: keyboard
    name: card_name
    wide: true

# Tap action allowing other tiles to open the virtual keyboard card
tap_actions:
  - id: open_keyboard
    label: tap_open_keyboard
    domains: [screen, script, media_player, input_text]
    card: keyboard
