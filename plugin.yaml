# Default substitution for the target Home Assistant script entity
defaults:
  TARGET_SCRIPT: "script.buscar_youtube_salao_festas"

# Extend Material Design Icons fonts with glyphs required by the keyboard keys
font:
  - id: !extend materialdesign_icons
    glyphs:
      - "\U000F0311" # keyboard-return
      - "\U000F0312" # keyboard-outline
      - "\U000F0B5C" # backspace-outline
  - id: !extend materialdesign_icons_mini
    glyphs:
      - "\U000F0311" # keyboard-return
      - "\U000F0312" # keyboard-outline
      - "\U000F0B5C" # backspace-outline

# Hidden LVGL keyboard widget on top_layer so ESPHome enables LV_USE_KEYBOARD and LV_USE_TEXTAREA
lvgl:
  top_layer:
    widgets:
      - keyboard:
          id: keyboard_seed
          hidden: true

# Instantiate the touch keyboard plugin component and bind the configured target script
touch_keyboard:
  script: ${TARGET_SCRIPT}
